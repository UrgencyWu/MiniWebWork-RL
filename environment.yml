name: miniwebwork
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=25
  - sqlite

# Bootstrap only. After activation:
#   1. install the CUDA-compatible PyTorch wheel for the target node;
#   2. run `pip install -e ".[test,training]"`;
#   3. run `python -m playwright install chromium`.
#
# PyTorch is deliberately absent because its wheel must match the server's
# driver/CUDA combination. Installing training extras before PyTorch may pull
# an unintended CPU build.

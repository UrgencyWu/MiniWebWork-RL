[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwebwork"
version = "0.3.0"
description = "Deterministic procurement browser-agent environment with SFT and Agentic RL rollout tooling"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MiniWebWork-RL Team"}]
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.22,<1",
    "playwright>=1.61,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "httpx>=0.28,<1",
]
model = [
    "transformers>=5.1,<6",
    "peft>=0.19,<1",
    "accelerate>=1.13,<2",
    "safetensors>=0.8,<1",
    "numpy>=2.2,<3",
]
training = [
    "transformers>=5.1,<6",
    "peft>=0.19,<1",
    "accelerate>=1.13,<2",
    "safetensors>=0.8,<1",
    "numpy>=2.2,<3",
    "datasets>=4.8,<5",
    "trl>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA device and local model weights",
    "browser: requires Playwright Chromium",
    "slurm: intended for execution through the cluster scheduler",
]
